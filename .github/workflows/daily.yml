name: Update portfolio and deploy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data dependencies
        run: pip install --quiet yfinance requests beautifulsoup4 pandas
      - name: Update market prices
        run: python scripts/update_prices.py
      - name: Update constant-FX history
        run: python scripts/update_fx_history.py
      - name: Update portfolio analytics
        run: python scripts/update_analytics.py
      - name: Update returns from total patrimony
        run: python scripts/update_period_returns.py
      - name: Update effective attribution
        run: python scripts/update_attribution.py
      - name: Enrich Rumor Radar technicals
        run: python scripts/update_trade_idea.py
      - name: Commit updated data
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio.json analytics.json trade_ideas.json
          git diff --cached --quiet || git commit -m "15-minute portfolio update"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
