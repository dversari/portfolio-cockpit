# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deploy copy
        run: |
          rm -rf /tmp/portfolio-site
          mkdir -p /tmp/portfolio-site
          rsync -a --exclude='.git' --exclude='_site' ./ /tmp/portfolio-site/
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/portfolio-site/index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="analytics-panel.js?v=14"></script>',
            '<script src="buy-dip-reserve.js?v=2"></script>',
            '<script src="fineco-import.js?v=2"></script>',
            '<script src="ai-chat.js?v=4"></script>',
            '<script src="central-mode.js?v=2"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/portfolio-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
