<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d2a22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Portafoglio"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Portfolio Cockpit</title><style>:root{--bg:#f4f5f2;--card:#fff;--text:#172019;--muted:#69736b;--line:#dde3dc;--good:#2f6b4f;--bad:#9d4545}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);padding-bottom:calc(72px + env(safe-area-inset-bottom))}.wrap{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 20px}h1{font-size:28px;margin:0}.sub{font-size:12px;color:var(--muted);margin:4px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:10px}.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.v{font-size:23px;font-weight:780;margin-top:5px}.pos{color:var(--good)}.neg{color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;color:var(--muted);text-transform:uppercase}.num{text-align:right}.bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(244,245,242,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px}.bottom button{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;font-weight:650}.bottom button.active{background:var(--text);color:white}.panel{display:none}.panel.active{display:block}.badge{display:inline-block;background:#eef1ed;border-radius:999px;padding:4px 8px;font-size:11px;color:#425146}.head{display:flex;justify-content:space-between;align-items:flex-start}.warn{color:#8a642e}.ok{color:var(--good)}@media(min-width:760px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="wrap"><div class="head"><div><h1>Portafoglio</h1><div class="sub">Portfolio Cockpit · aggiornamento automatico</div></div><span id="status" class="badge">caricamento…</span></div><section id="dash" class="panel active"><div class="grid"><div class="card"><div class="k">Valore verificato</div><div class="v" id="value">—</div><div class="sub" id="coverage"></div></div><div class="card"><div class="k">Costo verificato</div><div class="v" id="cost">—</div></div><div class="card"><div class="k">P/L verificato</div><div class="v" id="pl">—</div><div id="plpct" class="sub"></div></div><div class="card"><div class="k">Valore Fineco iniziale</div><div class="v" id="base">—</div></div><div class="card"><div class="k">Aggiornato</div><div class="v" style="font-size:16px" id="date">—</div></div></div><div class="card"><div class="k">Copertura feed</div><div class="sub" id="feednote" style="font-size:13px;line-height:1.5;margin-top:6px"></div></div></section><section id="positions" class="panel"><div class="card"><div class="k">Posizioni</div><div style="overflow:auto"><table><thead><tr><th>Strumento</th><th>Ticker</th><th class="num">Qty</th><th class="num">Prezzo</th><th class="num">Valore €</th><th class="num">Giorno</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div><nav class="bottom"><button class="active" data-tab="dash">Dashboard</button><button data-tab="positions">Posizioni</button></nav><script>const euro=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n)||0);const pct=n=>new Intl.NumberFormat('it-IT',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);async function load(){try{const r=await fetch('portfolio.json?'+Date.now());const d=await r.json();const live=d.verifiedValue||0,cost=d.verifiedCost||0,p=live-cost;document.getElementById('value').textContent=live?euro(live):'in attesa';document.getElementById('cost').textContent=cost?euro(cost):'—';document.getElementById('base').textContent=euro(d.baselineValue);const pe=document.getElementById('pl');pe.textContent=live&&cost?euro(p):'—';pe.className='v '+(p>=0?'pos':'neg');document.getElementById('plpct').textContent=live&&cost?pct(p/cost):'';document.getElementById('coverage').textContent=(d.verifiedCount||0)+' / '+d.positions.length+' posizioni';document.getElementById('date').textContent=d.asOf;document.getElementById('feednote').innerHTML=(d.verifiedCount?'<span class="ok">'+d.verifiedCount+' posizioni aggiornate automaticamente.</span> ':'Il primo aggiornamento automatico non è ancora completato. ')+(d.unverifiedCount?'<span class="warn">'+d.unverifiedCount+' richiedono una fonte diversa o aggiornamento manuale.</span>':'');document.getElementById('rows').innerHTML=d.positions.map(x=>`<tr><td><b>${x.name}</b><br><span class="sub">${x.cat||''}${x.error?' · '+x.error:''}</span></td><td>${x.symbol||''}</td><td class="num">${x.qty}</td><td class="num">${x.price==null?'—':x.price.toLocaleString('it-IT',{maximumFractionDigits:4})+' '+(x.feedCurrency||x.currency||'')}</td><td class="num">${x.valueEUR==null?'—':euro(x.valueEUR)}</td><td class="num ${x.dayChangePct>=0?'pos':'neg'}">${x.dayChangePct==null?'—':pct(x.dayChangePct)}</td></tr>`).join('');document.getElementById('status').textContent=navigator.onLine?'online':'offline'}catch(e){document.getElementById('status').textContent='dati non disponibili'}}document.querySelectorAll('.bottom button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');load();</script></body></html>
